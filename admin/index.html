<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme on load. Always
      // explicit ("dark" or "light") — index.css's `dark:` variant matches on the literal
      // [data-theme="dark"] attribute, not on its absence.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('maroon-admin-theme') === 'light') theme = 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;

        // Re-apply the last-seen store theme colours (written by src/lib/theme.ts) so a store
        // with custom colours doesn't flash the defaults until /settings/public responds.
        try {
          var vars = JSON.parse(localStorage.getItem('maroon-admin-theme-vars') || '{}');
          for (var key in vars) {
            if (key.indexOf('--') === 0) document.documentElement.style.setProperty(key, vars[key]);
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
